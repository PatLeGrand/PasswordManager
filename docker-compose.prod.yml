services:

  mysql:
    image: mysql:8.0
    container_name: aether_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: password_manager
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aether_server
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD}@mysql:3306/password_manager
      JWT_SECRET:   ${JWT_SECRET}
      EMAIL_USER:   ${EMAIL_USER}
      EMAIL_PASS:   ${EMAIL_PASS}
      NODE_ENV:     production
      RP_ID:        ${DOMAIN}
      ORIGIN:       https://${DOMAIN}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: aether_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - server
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: aether_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renouvelle automatiquement le certificat toutes les 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
