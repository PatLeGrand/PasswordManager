# ── HTTP → redirige vers HTTPS (après obtention du certificat) ──
server {
    listen 80;
    server_name aether-manager.ca www.aether-manager.ca;

    # Nécessaire pour la validation Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    server_name aether-manager.ca www.aether-manager.ca;

    ssl_certificate     /etc/letsencrypt/live/aether-manager.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aether-manager.ca/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy vers l'API Express
    location /api/ {
        proxy_pass         http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques React (SPA)
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
        gzip_static on;
    }
}
